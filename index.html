<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try KobPay</title>
<meta name="description" content="A walk through KobPay: tap the product or read the guide. Either can be read aloud.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F2EC">
<meta property="og:title" content="Try KobPay">
<meta property="og:description" content="Tap through the product, or read the guide.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap">

</head>
<body>
<style>
/* Two ways through the same material: a phone you tap, or the guide you read.
   One narrator reads whichever is open, so an investor can listen while they
   look. */
:root {
  --paper: #F2EFE9; --paper-2: #E8E3D9; --ink-text: #1A1814; --ink-soft: #5E584D;
  --rule: rgba(26,24,20,0.12); --gold-text: #8A6D1F;

  /* The phone screen never changes theme: it is a photograph of a dark app,
     and these are the app's own values. */
  --app-ink: #07070A; --app-card: #1A1A22; --app-card-2: #14141A;
  --app-white: #F5F2EC; --app-silver: #A0A0A8; --app-muted: #72727A;
  --app-gold: #C9A84C; --app-gold-2: #E8C97A;
  --app-line: rgba(255,255,255,0.065); --app-goldln: rgba(201,168,76,0.22);
  --app-good: #2ECC71; --app-bad: #E74C3C; --app-blue: #8FB8D4;

  --display: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Syne', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15140F; --paper-2: #1E1C16; --ink-text: #EDE8DC;
    --ink-soft: #A49C8A; --rule: rgba(237,232,220,0.14); --gold-text: #D8B960;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15140F; --paper-2: #1E1C16; --ink-text: #EDE8DC;
  --ink-soft: #A49C8A; --rule: rgba(237,232,220,0.14); --gold-text: #D8B960;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink-text); font-family: var(--sans); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 72px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 480px; margin: 0 auto; }

h1 { font-family: var(--display); font-weight: 300; font-size: clamp(2rem, 8.5vw, 2.8rem); letter-spacing: -0.015em; line-height: 1.05; margin: 0 0 8px; text-wrap: balance; }
h1 em { font-style: normal; color: var(--gold-text); }
.standfirst { font-size: 0.93rem; color: var(--ink-soft); margin: 0 0 18px; max-width: 40ch; }

/* ---- mode switch + narrator ---- */
.modebar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.mode { display: flex; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 99px; padding: 3px; }
.mode button {
  background: none; border: none; cursor: pointer; padding: 8px 16px; border-radius: 99px;
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft);
}
.mode button[aria-current="true"] { background: var(--ink-text); color: var(--paper); }
.listen {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; margin-left: auto;
  background: none; border: 1px solid var(--rule); border-radius: 99px; padding: 8px 14px;
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft);
}
.listen:hover { color: var(--ink-text); border-color: var(--gold-text); }
.listen[aria-pressed="true"] { background: var(--gold-text); color: var(--paper); border-color: var(--gold-text); }
.listen svg { width: 13px; height: 13px; fill: currentColor; }

/* ---- chapters ---- */
.chapters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; }
.chapters button {
  font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.09em;
  padding: 6px 10px; border-radius: 99px; cursor: pointer; background: transparent;
  color: var(--ink-soft); border: 1px solid var(--rule);
}
.chapters button:hover { color: var(--ink-text); }
.chapters button[aria-current="true"] { background: var(--ink-text); color: var(--paper); border-color: var(--ink-text); }

/* ---- phone ---- */
.phone {
  width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 360 / 740;
  background: var(--app-ink); border-radius: 34px; border: 1px solid var(--rule);
  box-shadow: 0 24px 60px -24px rgba(0,0,0,0.5), 0 2px 0 rgba(255,255,255,0.04) inset;
  overflow: hidden; display: flex; flex-direction: column; color: var(--app-white);
}
.status { flex: 0 0 auto; display: flex; justify-content: space-between; padding: 12px 20px 4px; font-family: var(--mono); font-size: 10px; color: var(--app-silver); letter-spacing: 0.06em; }
.status .dots { display: flex; gap: 3px; align-items: center; }
.status .dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--app-silver); display: block; }
.screen { flex: 1 1 auto; overflow-y: auto; padding: 10px 20px 14px; }
.screen::-webkit-scrollbar { width: 0; }

.greet { font-family: var(--display); font-size: 1.5rem; font-weight: 300; margin: 6px 0 2px; }
.greet em { font-style: normal; color: var(--app-gold); }
.datel { font-family: var(--mono); font-size: 9px; color: var(--app-muted); letter-spacing: 0.1em; margin-bottom: 14px; }
.lbl { font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.24em; color: var(--app-muted); margin-bottom: 8px; }

.balcard { background: var(--app-card); border: 1px solid var(--app-line); border-radius: 16px; padding: 16px; margin-bottom: 10px; }
.figure { font-family: var(--display); font-weight: 300; letter-spacing: -0.02em; line-height: 1; color: var(--app-gold); font-size: 2.9rem; font-variant-numeric: tabular-nums; }
.figure .frac { font-size: 0.6em; }
.figure-unit { font-family: var(--display); font-weight: 300; font-size: 1.4rem; color: var(--app-white); margin-left: 7px; }
.usd { font-family: var(--mono); font-size: 10px; color: var(--app-muted); margin-top: 7px; }

.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 16px; }
.act { background: var(--app-card-2); border: 1px solid var(--app-line); color: var(--app-silver); border-radius: 10px; padding: 9px 2px; font-family: var(--mono); font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: 500; }
.act:hover, .act:focus-visible { border-color: var(--app-goldln); color: var(--app-white); outline: none; }
.act.primary { background: var(--app-gold); color: var(--app-ink); border-color: var(--app-gold); font-weight: 700; }
.act svg { width: 13px; height: 13px; stroke-width: 2; fill: none; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.tile { background: var(--app-card); border: 1px solid var(--app-line); border-radius: 12px; padding: 12px; text-align: left; width: 100%; cursor: pointer; color: inherit; font: inherit; }
.tile:hover { border-color: var(--app-goldln); }
.tile .v { font-family: var(--display); font-size: 1.4rem; font-weight: 300; font-variant-numeric: tabular-nums; }
.tile .k { font-family: var(--mono); font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--app-muted); margin-bottom: 3px; }

.field { margin-bottom: 13px; }
.inp { width: 100%; background: var(--app-card-2); border: 1px solid var(--app-line); border-radius: 11px; padding: 12px 13px; color: var(--app-white); font-family: var(--mono); font-size: 14px; }
.inp:focus { outline: none; border-color: var(--app-goldln); }
.inp::placeholder { color: #4A4A52; }

.btn { width: 100%; background: var(--app-gold); color: var(--app-ink); border: none; border-radius: 11px; padding: 13px; font-family: var(--mono); font-weight: 700; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.16em; cursor: pointer; }
.btn:hover { background: var(--app-gold-2); }
.btn[disabled] { opacity: 0.35; cursor: default; }
.btn.ghost { background: transparent; color: var(--app-silver); border: 1px solid var(--app-line); font-weight: 400; }
.btn.ghost:hover { color: var(--app-white); border-color: var(--app-goldln); }
.btn.sm { padding: 9px 8px; font-size: 8.5px; letter-spacing: 0.1em; }

.who { background: var(--app-card); border: 1px solid var(--app-goldln); border-radius: 12px; padding: 13px; margin-bottom: 13px; display: flex; gap: 11px; align-items: center; }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; background: linear-gradient(135deg, var(--app-gold-2), #AA771C); color: var(--app-ink); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.who .nm { font-weight: 700; font-size: 13px; }
.who .ph { font-family: var(--mono); font-size: 10px; color: var(--app-muted); }

.warn { font-size: 10.5px; color: var(--app-silver); line-height: 1.55; background: rgba(201,168,76,0.06); border: 1px solid var(--app-goldln); border-radius: 10px; padding: 11px; margin-bottom: 13px; }
.warn.bad { background: rgba(231,76,60,0.08); border-color: rgba(231,76,60,0.3); }
.warn.good { background: rgba(46,204,113,0.07); border-color: rgba(46,204,113,0.25); }

.rowline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--app-line); }
.rowline:last-of-type { border-bottom: none; }
.rowline .k { font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--app-muted); }
.rowline .v { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
.rowline .v.free { color: var(--app-good); }
.rowline .v.big { font-family: var(--display); font-size: 1.4rem; }

.done { text-align: center; padding: 34px 0 16px; }
.tick { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 16px; border: 1.5px solid var(--app-good); display: grid; place-items: center; animation: pop 0.4s cubic-bezier(.2,.9,.3,1.3); }
.tick.bad { border-color: var(--app-bad); }
@keyframes pop { from { transform: scale(0.5); opacity: 0 } }
.tick svg { width: 22px; height: 22px; stroke: var(--app-good); stroke-width: 2.5; fill: none; }
.tick.bad svg { stroke: var(--app-bad); }
.done .big { font-family: var(--display); font-size: 1.9rem; font-weight: 300; }
.done .sub { font-family: var(--mono); font-size: 9.5px; color: var(--app-muted); letter-spacing: 0.08em; margin-top: 5px; }

.qrbox { background: var(--app-white); border-radius: 14px; padding: 14px; width: 164px; margin: 4px auto 12px; }
.qr { display: grid; grid-template-columns: repeat(21, 1fr); aspect-ratio: 1; }
.qr i { display: block; background: transparent; }
.qr i.on { background: #07070A; }

.segment { display: grid; gap: 4px; background: var(--app-card-2); border: 1px solid var(--app-line); border-radius: 11px; padding: 4px; margin-bottom: 14px; }
.segment.c3 { grid-template-columns: repeat(3, 1fr); }
.segment.c2 { grid-template-columns: repeat(2, 1fr); }
.segment button { background: none; border: none; cursor: pointer; padding: 8px 2px; border-radius: 8px; font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--app-muted); }
.segment button[aria-current="true"] { background: var(--app-gold); color: var(--app-ink); font-weight: 700; }

.cardface { aspect-ratio: 1.586; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--app-goldln); background: linear-gradient(135deg, #1A1A22 0%, #0E0E14 45%, #231d0e 100%); position: relative; overflow: hidden; margin-bottom: 10px; }
.cardface::after { content: ""; position: absolute; inset: 0; opacity: 0.07; background: linear-gradient(115deg, transparent 30%, #FFF0A8 50%, transparent 70%); }
.cardface.frozen { border-color: rgba(34,211,238,0.35); filter: grayscale(0.45) brightness(0.8); }
.cardface .brand { font-family: var(--display); font-size: 0.9rem; letter-spacing: 0.2em; }
.cardface .brand b { color: var(--app-gold); font-weight: 400; }
.chip { width: 29px; height: 21px; border-radius: 4px; background: linear-gradient(135deg, var(--app-gold-2), #AA771C); position: relative; }
.chip::before { content: ""; position: absolute; inset: 7px 4px; border-top: 1px solid rgba(7,7,10,0.35); border-bottom: 1px solid rgba(7,7,10,0.35); }
.cardface .num { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.09em; }
.cardface .foot { display: flex; justify-content: space-between; align-items: flex-end; }
.cardface .foot .t { font-family: var(--mono); font-size: 7px; letter-spacing: 0.15em; color: var(--app-muted); text-transform: uppercase; }

.bar { height: 5px; background: var(--app-ink); border: 1px solid var(--app-line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--app-gold); }
.bar.good > span { background: var(--app-good); }

.pill { font-family: var(--mono); font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.13em; padding: 3px 7px; border-radius: 99px; background: rgba(255,255,255,0.06); color: var(--app-silver); }
.pill.on { background: rgba(46,204,113,0.12); color: var(--app-good); }
.pill.cold { background: rgba(34,211,238,0.12); color: var(--app-blue); }
.pill.bad { background: rgba(231,76,60,0.12); color: var(--app-bad); }

.fp { display: grid; place-items: center; padding: 20px 0 10px; }
.fpring { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--app-goldln); cursor: pointer; position: relative; }
.fpring svg { width: 38px; height: 38px; stroke: var(--app-gold); fill: none; stroke-width: 1.4; }
.fpring::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px solid var(--app-goldln); opacity: 0; }
.fpring.scanning::before { animation: ring 1s ease-out infinite; }
@keyframes ring { from { opacity: 0.8; transform: scale(0.9) } to { opacity: 0; transform: scale(1.18) } }
.fpring.ok { border-color: var(--app-good); }
.fpring.ok svg { stroke: var(--app-good); }

.browser { border: 1px solid var(--app-line); border-radius: 12px; overflow: hidden; margin-bottom: 13px; }
.browser .bar2 { background: #22222A; padding: 7px 10px; font-family: var(--mono); font-size: 8.5px; color: var(--app-muted); }
.browser .body2 { background: #F4F4F6; color: #15151A; padding: 13px; }
.browser h4 { margin: 0 0 2px; font-size: 13px; font-weight: 800; }
.browser .price { font-family: var(--display); font-size: 1.6rem; font-weight: 400; }
.browser .cardinput { background: #fff; border: 1px solid #D8D8DE; border-radius: 8px; padding: 8px 9px; font-family: var(--mono); font-size: 10.5px; margin-top: 8px; color: #15151A; }

.code6 { font-family: var(--mono); font-size: 2rem; letter-spacing: 0.28em; text-align: center; color: var(--app-gold); padding: 14px 0 4px; font-variant-numeric: tabular-nums; }

.gauge { text-align: center; padding: 10px 0 4px; }
.gauge .n { font-family: var(--display); font-size: 3.4rem; font-weight: 300; color: var(--app-gold); line-height: 1; }
.gauge .band { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; color: var(--app-good); text-transform: uppercase; margin-top: 6px; }

.evt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--app-line); }
.evt:last-child { border-bottom: none; }
.evt .t { font-size: 12px; font-weight: 600; }
.evt .d { font-family: var(--mono); font-size: 8.5px; color: var(--app-muted); letter-spacing: 0.08em; margin-top: 2px; }
.evt .a { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.evt .a.in { color: var(--app-good); }

.nav { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--app-line); background: rgba(10,14,20,0.96); }
.nav button { background: none; border: none; cursor: pointer; padding: 10px 2px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--mono); font-size: 7px; text-transform: uppercase; letter-spacing: 0.1em; color: #6B7280; }
.nav button svg { width: 15px; height: 15px; stroke-width: 1.8; fill: none; }
.nav button[aria-current="true"] { color: var(--app-gold); }

.caption { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 16px; }
.caption h2 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; margin: 0 0 6px; }
.caption p { margin: 0 0 10px; font-size: 0.89rem; color: var(--ink-soft); }
.caption p:last-of-type { margin-bottom: 0; }
.caption strong { color: var(--ink-text); font-weight: 600; }
.try { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-text); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 12px; margin-top: 10px; }
.try::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold-text); }

/* ---- the written guide ---- */
.guide h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 30px 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
.guide h2:first-child { margin-top: 0; }
.guide p { font-size: 0.93rem; margin: 0 0 12px; }
.guide p.lede { font-size: 1.02rem; color: var(--ink-text); }
.guide strong { font-weight: 700; }
.guide ul, .guide ol { margin: 0 0 12px; padding-left: 20px; }
.guide li { margin-bottom: 5px; font-size: 0.91rem; }
.guide .gtable { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 0.85rem; }
.guide .gtable th { text-align: left; font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--ink-soft); padding: 7px 8px 7px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.guide .gtable td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; color: var(--ink-soft); }
.guide .gtable td:first-child { color: var(--ink-text); font-weight: 600; width: 36%; }
.sect { scroll-margin-top: 20px; }
.sect.on h2 { color: var(--gold-text); }

.foot-note { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 0.8rem; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <h1>Try <em>KobPay</em></h1>
  <p class="standfirst">The whole product, two ways: tap through it, or read it. Either can be read aloud.</p>

  <div class="modebar">
    <div class="mode" id="mode">
      <button data-mode="demo" aria-current="true">Demo</button>
      <button data-mode="guide" aria-current="false">Read</button>
    </div>
    <button class="listen" id="listen" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 2v2a8 8 0 010 16v2a10 10 0 000-20z"/></svg>
      <span id="listenLabel">Listen</span>
    </button>
  </div>

  <div id="demoMode">
    <div class="chapters" id="chapters"></div>
    <div class="phone">
      <div class="status"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>
      <div class="screen" id="screen"></div>
      <nav class="nav" id="nav">
        <button data-ch="wallet"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Home</button>
        <button data-ch="send"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M7 17L17 7M9 7h8v8"/></svg>Send</button>
        <button data-ch="paid"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>Pay</button>
        <button data-ch="cards"><svg viewBox="0 0 24 24" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Cards</button>
      </nav>
    </div>
    <div class="caption" id="caption"></div>
  </div>

  <div id="guideMode" class="guide" hidden></div>

  <p class="foot-note">
    A demonstration. Every balance, name, merchant and card number in it is invented,
    and none of it connects to a real account. The live app is at <strong>kobpay.app</strong>.
  </p>
</div>

<script>
(function () {
  "use strict";

  var S = {
    mode: "demo", ch: "wallet", step: 0, balance: 247.5, amount: "",
    payMode: "show", openCard: 0, frozen: false, momoMode: "in", momoAmt: "",
    saved: 310, speaking: false, guideSection: 0
  };

      '<div class="rowline"><span class="k">Daily limit</span><span class="v">15,000 KPC</span></div>' +
      '<div class="rowline"><span class="k">Verification</span><span class="v">ID confirmed</span></div>' +
      '<div class="rowline"><span class="k">Payment PIN</span><span class="v">Set</span></div>' +
      '<div style="height:12px"></div>' +
      '<div class="warn"><strong style="color:var(--app-gold)">KobPay will never ask for your PIN.</strong> Not by phone, text or WhatsApp. Anyone asking is stealing from you.</div>',
      title: "The security that regulators now insist on",
      body: "<p>Japan's financial regulator has ruled that passwords <em>and SMS one-time codes</em> are no longer sufficient for financial accounts. Every major brokerage there moved to passkeys through 2025 and 2026.</p>" +
            "<p>KobPay uses the same mechanism. <strong>The fingerprint never leaves the phone</strong> — there is no biometric database here to breach — and it cannot be used on a fake site at all, which is what stops the phishing that SMS codes cannot.</p>",
      hint: "Next: Limits" };
  },

  limits: function () {
    if (S.step === 0) return { html:
      '<div class="lbl" style="margin-top:8px">Your limits</div>' +
      '<div class="balcard"><div class="lbl">Your tier</div>' +
      '<div style="font-family:var(--display);font-size:1.9rem;font-weight:300;color:var(--app-gold)">Verified</div>' +
      '<div class="usd">Photo ID, and a name that matches it</div></div>' +
      '<div class="rowline"><span class="k">One payment</span><span class="v">600.00</span></div>' +
      '<div class="rowline"><span class="k">In a day</span><span class="v">1,200.00</span></div>' +
      '<div class="rowline"><span class="k">In a month</span><span class="v">12,000.00</span></div>' +
      '<div class="rowline"><span class="k">Most you may hold</span><span class="v">4,000.00</span></div>' +
      '<div style="height:10px"></div>' +
      '<div class="lbl">Used today</div><div class="bar"><span style="width:21%"></span></div>' +
      '<div style="font-family:var(--mono);font-size:8.5px;color:var(--app-muted);margin-top:6px;letter-spacing:0.1em">247.50 OF 1,200.00</div>' +
      '<button class="btn" data-act="step" data-i="1">How to raise them</button>',
      title: "Four numbers, not one",
      body: "<p>A limit is not a single figure. Four of them apply at once: the most in one payment, the most in a day, the most in a month, and the most you may ever be holding.</p>" +
            "<p>The last one catches people out. You can be well inside your daily limit and still be refused because the payment would push your <em>balance</em> over the ceiling for your tier.</p>",
      hint: "See how to raise them" };

    return { html:
      '<div class="lbl" style="margin-top:8px">The four tiers</div>' +
      '<div class="evt"><div><div class="t">Basic</div><div class="d">A VERIFIED PHONE NUMBER</div></div><div class="a">240 / day</div></div>' +
      '<div class="evt"><div><div class="t">Verified &mdash; you</div><div class="d">GOVERNMENT PHOTO ID</div></div><div class="a in">1,200 / day</div></div>' +
      '<div class="evt"><div><div class="t">Full</div><div class="d">PHOTO ID AND PROOF OF ADDRESS</div></div><div class="a">4,000 / day</div></div>' +
      '<div class="evt"><div><div class="t">Business</div><div class="d">REGISTRATION, OWNER AT FULL</div></div><div class="a">25,000 / day</div></div>' +
      '<div style="height:12px"></div>' +
      '<div class="warn">Above 5,000 KPC you will also be asked where the money came from. That is the rule everywhere, not a KobPay invention.</div>' +
      '<button class="btn" data-act="again">Back to your limits</button>',
      title: "Every tier is a document away",
      body: "<p>Nobody has to apply or wait for a decision. Each tier states exactly which document opens it, and sending that document is the whole process.</p>" +
            "<p>A new account starts on Basic — 240 KPC a day — which is deliberately cautious. It is the setting that lets someone try the app the same hour they hear about it, without a stranger being able to move real money through a phone number nobody has checked.</p>" +
            "<p>Card limits are separate and sit underneath all of this. A card capped at 15 KPC a month stays capped at 15 whatever your tier allows.</p>",
      hint: "Next: Markets" };
  },

    return { html:

      '<div style="height:12px"></div>' +
      '<div class="warn">Rates are fetched daily and recorded. A move of more than 25 percent in one refresh is rejected rather than applied &mdash; a feed that wrong is more likely broken than real.</div>',
      title: "Why anyone wants dollars",
      body: "<p>This is the demand in one screen. The percentages are what a year of holding the local currency cost someone, against the dollar.</p>" +
            "<p>KobPay prices <strong>96 currencies</strong> and records every rate it has ever used, so a deposit from three months ago can be checked against the rate that was actually live when it was taken. An examiner will ask; so will a customer.</p>",
      hint: "Last: the reserve" };

  reserve: function () {
    return { html:
      '<div class="lbl" style="margin-top:8px">The reserve &mdash; public</div>' +
      '<div class="balcard"><div class="lbl">KPC in existence</div>' +
      '<div style="font-family:var(--display);font-size:1.9rem;font-weight:300">1,482,900<span style="font-size:0.85rem;color:var(--app-gold);margin-left:6px">KPC</span></div>' +
      '<div style="font-family:var(--mono);font-size:8.5px;color:var(--app-muted);margin-top:6px">EVERY ONE IS A DOLLAR OWED TO SOMEBODY</div></div>' +
      '<div class="balcard"><div class="lbl">Money held to back it</div>' +
      '<div style="font-family:var(--display);font-size:1.9rem;font-weight:300"><span style="color:var(--app-good);font-size:0.95rem">$</span>1,575,100</div></div>' +
      '<div class="balcard" style="border-color:rgba(46,204,113,0.25)"><div class="lbl">Cover</div>' +
      '<div style="font-family:var(--display);font-size:2.5rem;font-weight:300;color:var(--app-good)">106.22%</div>' +
      '<div style="font-family:var(--mono);font-size:8.5px;color:var(--app-muted);margin-top:4px">EVERY KPC IS COVERED</div></div>' +
      '<div class="warn">These figures are KobPay&rsquo;s own, checked against KobPay&rsquo;s own bank statements. They have not been examined by an independent accountant.</div>',
      title: "The number nobody can fake",
      body: "<p>Anyone can open this without an account — a customer, a journalist, a regulator. It shows what is owed, what is held and the ratio between them, read from the ledger rather than typed in.</p>" +
            "<p>The grey box is there on purpose. <strong>These are self-reported figures, and the page says so.</strong> A money app that shows numbers without saying who checked them is asking for more trust than it has earned.</p>",
      hint: "That's the tour — jump back to any chapter" };
  }
  };

  /* ------------------------------------------------------------------ guide */

  var GUIDE = [
    { h: "What KobPay is", html:
      '<p class="lede">KobPay is an app that holds your money as US dollars and lets you send it to other people instantly, for free.</p>' +
      '<p>Think of it like a bank account on your phone, with one difference that matters: the money inside is counted in dollars rather than cedis. If the cedi loses value against the dollar next month, what you are holding does not shrink with it.</p>' +
      '<p>You can also use it to:</p><ul>' +
      '<li>Send money to anyone else who has KobPay, using their phone number</li>' +
      '<li>Get paid, by showing a QR code</li><li>Pay shops and apps that accept KobPay</li>' +
      '<li>Put money aside in a savings plan and earn interest on it</li>' +
      '<li>Save together with a group of friends or family</li>' +
      '<li>Borrow a small amount, if you have been using the app for a while</li></ul>' +
      '<p>Everything in this guide is something the app does today. Where a part is not switched on yet, it says so.</p>' },

    { h: "What one KPC is worth", html:
      '<p class="lede">One KPC is one US dollar. It does not move.</p>' +
      '<p>KPC stands for KobPay Coin. It is the unit your balance is counted in, the way a bank account is counted in cedis or pounds. If your balance says 40.00 KPC, that is forty US dollars.</p>' +
      '<p>This is not a cryptocurrency that goes up and down. There is nothing to trade and nothing to time. One KPC was a dollar yesterday and will be a dollar next year.</p>' +
      '<p><strong>Why it works that way.</strong> For every KPC that exists, KobPay holds real money to back it. If everybody asked for their money at once, it would be there. You do not have to take that on trust — the Ledger page shows what is held and what is owed, and anyone can look, including people who have never signed up.</p>' +
      '<p><strong>What it means for you.</strong> If the cedi weakens against the dollar, your KobPay balance buys the same amount of imported goods as before. That is the whole point of holding dollars.</p>' },

    { h: "Getting started", html:
      '<p>Three steps, about two minutes.</p><ol>' +
      '<li><strong>Open the app.</strong> Go to kobpay.app on your phone. There is nothing to download.</li>' +
      '<li><strong>Sign up with your phone number.</strong> You will get a code by text. Type it in. That is your account.</li>' +
      '<li><strong>Set a PIN.</strong> Four digits, used to approve payments. Pick something that is not your birthday and not 1234.</li></ol>' +
      '<p>That is it. You now have a wallet with a balance of 0.00 KPC, and you can receive money from anyone straight away.</p>' +
      '<p><strong>Add it to your home screen</strong> so it opens like any other app. On an iPhone, tap the share button in Safari and choose Add to Home Screen. On Android, tap the three dots in Chrome and choose Add to Home screen.</p>' },

    { h: "Your wallet screen", html:
      '<p>The big gold number is your money. Everything else on the screen explains it.</p>' +
      '<table class="gtable"><thead><tr><th>What you see</th><th>What it means</th></tr></thead><tbody>' +
      '<tr><td>The large number, in KPC</td><td>Everything you have. 40.00 KPC is forty US dollars.</td></tr>' +
      '<tr><td>The smaller line underneath</td><td>The same amount written in dollars, so the two never disagree.</td></tr>' +
      '<tr><td>Interest today</td><td>What your savings earned today. It reads 0.00 until you open a savings plan.</td></tr>' +
      '<tr><td>Sent this month</td><td>Everything you have sent since the first of the month.</td></tr>' +
      '<tr><td>Received</td><td>Everything that came in this month.</td></tr>' +
      '<tr><td>Businesses paid</td><td>How many shops or apps you paid this month.</td></tr>' +
      '</tbody></table>' +
      '<p>If a tile shows an arrow and a percentage, it is comparing this month with last month. It only appears once there is a last month to compare with — in your first month there is nothing honest to say, so it says nothing.</p>' },

    { h: "Sending money", html:
      '<p class="lede">You need their phone number. That is all.</p><ol>' +
      '<li>Tap Send.</li><li>Type their phone number, or pick them from your contacts.</li>' +
      '<li>Type the amount.</li><li>Check the name that comes up. <strong>Read it properly.</strong> If it is not who you meant, stop.</li>' +
      '<li>Approve with your PIN or your fingerprint.</li></ol>' +
      '<p>It arrives immediately, and it is free. Not free-with-conditions — sending KPC to another KobPay user costs nothing, because it is a line moving in KobPay’s own records rather than money travelling between banks.</p>' +
      '<p><strong>Before you tap send, check the name.</strong> A wrong digit sends your money to a stranger, and once it has arrived it belongs to them. KobPay shows you the recipient’s name for exactly this reason. It is the one moment in the app worth slowing down for.</p>' },

    { h: "Getting paid", html:
      '<p>Tap Receive and show someone your screen. A QR code appears. They open KobPay, tap Pay, point their camera at it, and the money comes to you. Neither of you types a number, so neither of you can get a digit wrong.</p>' +
      '<p>If they are not with you, just give them your phone number. That is your address in KobPay — there is nothing else to remember.</p>' +
      '<p><strong>Selling something?</strong> The Take Payments screen makes you a payment link you can send in WhatsApp. The buyer taps it, pays, and you see it arrive. The merchant fee is capped at one percent, against the two to four percent a card terminal costs.</p>' },

    { h: "Putting money in, and taking it out", html:
      '<p>There are two routes in, and two routes out.</p>' +
      '<p><strong>Through an agent.</strong> A KobPay agent is a person with a shop or a stall, the way a mobile money agent is. You hand them cash and they send the same amount to your KobPay. To take cash out, you create a code in the app, show it to them, and they hand you notes.</p>' +
      '<p><strong>From mobile money or a card.</strong> Tap Top up, choose how much, and pay the way you normally would. The same amount lands in your wallet as KPC. To go the other way, tap Withdraw and the money goes to your mobile money number or your bank account.</p>' +
      '<p><strong>One honest note.</strong> The mobile money and card route is still being switched on — KobPay is finishing the approval with its payments partner. Until that is done, agents are the way in and out.</p>' +
      '<p><strong>What it costs.</strong> Topping up and withdrawing have a fee, because the mobile money network and the bank charge KobPay to move real money. The app shows the exact amount before you confirm, never a percentage you have to work out. Sending to another KobPay user stays free.</p>' },

    { h: "Saving", html:
      '<p class="lede">Money you move into savings earns interest. Money sitting in your wallet does not.</p>' +
      '<p><strong>How to start.</strong> Go to Savings, open a plan, give it a name and move some money in. The name matters more than it sounds — &ldquo;Laptop&rdquo; is harder to raid than &ldquo;Savings&rdquo;.</p>' +
      '<p><strong>Set a target.</strong> The app shows a bar filling up and how far you have left. People who set a target save more than people who do not; it is simply easier to keep going when you can see the end.</p>' +
      '<p><strong>Getting it back.</strong> You can take money out whenever you want. Some plans are locked for a set time in exchange for a better rate — break one early and you lose some of the interest you had earned. The app tells you the exact amount before you confirm.</p>' +
      '<p><strong>Where the interest comes from.</strong> KobPay holds the money backing everyone’s KPC, and that money earns something where it sits. A share of it comes to you. The rate is tied to what is actually earned, which is why it is a real number rather than an eye-catching one.</p>' },

    { h: "Investing", html:
      '<p><strong>Nothing is listed yet, and that is deliberate.</strong> The investment part of KobPay is built and working, but the shelf is empty. What may be offered to the public is a licensed issuer&rsquo;s decision, not something an app should write for itself. When a partner confirms what may be sold, it appears here.</p>' +
      '<p>This is how it works when something is listed. You spend KPC and receive <strong>units</strong>. Your holding is the number of units multiplied by what a unit is worth that day, and that figure moves — which is the point of an investment.</p>' +
      '<p><strong>Why units and not KPC.</strong> One KPC is one dollar, always. That is the whole promise and everything in KobPay depends on it. An investment is supposed to change in value, so it cannot be held as KPC: the first time it gained, either the promise would break or the gain could not be recorded. Holding units sidesteps the problem. KPC is only how you get in and how you get out; in between, your money is not KPC at all.</p>' +
      '<p><strong>Selling takes a day or two</strong>, because the money has to come back from the issuer. The price, though, is fixed the moment you ask — not the day it lands. Otherwise you would be carrying two days of market movement after you had already decided to leave.</p>' +
      '<p>Some investments have a minimum time you must hold them. If you try to sell early the app tells you which one and how many days remain, rather than failing without explanation.</p>' },

    { h: "Saving with a group", html:
      '<p>A group of people each put in the same amount every round, and each round one person takes the whole pot. When everyone has had a turn, it ends. It is a way to reach a useful lump of money sooner than saving alone would allow: eight of you at 20 KPC a month means somebody walks away with 160 this month rather than waiting eight months to have saved it.</p>' +
      '<p><strong>Where the money sits.</strong> Contributions do not go into the organiser&rsquo;s wallet. They go into an account belonging to the circle itself, and that account obeys the same rule as every account in KobPay: it cannot go below zero. A circle therefore cannot pay out money it has not collected. Not as a promise — as an impossibility.</p>' +
      '<p><strong>The pot is what came in, not what was promised.</strong> If two of eight do not pay, the person receiving gets six shares. Nobody covers the gap and nobody owes it to them. This sounds harsh until you consider the alternative: a guaranteed pot means the missing money has to come from the organiser or from the other members, which is how these arrangements collapse.</p>' +
      '<p><strong>Falling behind costs you your turn.</strong> Payout order follows your position in the circle, but only among members who are paid up. If your turn arrives while you owe an earlier round, you are passed over and the pot goes to the next person who is not behind. You do not lose your place permanently — you get it once you have caught up.</p>' +
      '<p><strong>A late payment goes to whoever was short.</strong> When somebody eventually pays a round they missed, that money is sent directly to the person who was left short in that round, not into the current pot. Otherwise the person who was short-changed would stay down forever while somebody unaffected received extra.</p>' +
      '<p><strong>What the app does not do.</strong> There is no debt collection, no legal recovery, no insurance fund. If somebody walks away, the consequences are that they lose their turn and their score falls. The rest rests on these being people who know each other, which is how susu has always worked.</p>' +
      '<p><strong>Before you join one</strong>, be sure you can afford the contribution every round until the end, not just the first one. The people after you in the order are relying on it.</p>' },

    { h: "Borrowing, and your score", html:
      '<p>If you have been using KobPay for a while, you can borrow a small amount. What decides it is your score, which sits between 300 and 850. Everybody starts at 500.</p>' +
      '<p>Six things move it, and each has a ceiling of its own so that no single one can carry the number:</p>' +
      '<p><strong>How long you have been here</strong> (up to 60 points). Time is the cheapest signal and the hardest to fake.<br>' +
      '<strong>How much you use it</strong> (up to 70). This counts payments rather than amounts, on purpose — three large transfers should not look like a habit the way thirty small ones do.<br>' +
      '<strong>Whether your identity is verified</strong> (up to 60), which rises with each tier of ID you complete.<br>' +
      '<strong>Saving</strong> (up to 80), from how many plans you hold and how much is in them — less 15 points for every plan you broke early.<br>' +
      '<strong>Circles</strong> (up to 120, the heaviest of the six).<br>' +
      '<strong>Disputes and fraud flags</strong>, which only ever subtract: 40 for each dispute upheld against you, 30 for each open flag.</p>' +
      '<p><strong>Why circles count for so much.</strong> The single biggest award in the whole system — 60 points — goes to somebody who took the pot and carried on contributing afterwards. Think about what that person has just done: they have their money, several rounds remain, and nothing physically compels them to pay any of them. Paying anyway is the most informative thing anyone can do in this app, and no credit bureau has ever been able to see it.</p>' +
      '<p>That is the reason lending here is priced off this score rather than a credit file. For most people in this market the credit file is empty. This one is not.</p>' +
      '<p><strong>Having no trouble earns you nothing.</strong> A clean record is the starting assumption, not an achievement. Only trouble moves that line, and only downwards.</p>' +
      '<p>Every input is shown to you, including the ones scoring zero. There is no part of it kept back.</p>' },

    { h: "Cards for paying online", html:
      '<p>A card lets you pay places that do not know what KobPay is — a streaming service, a shop abroad, anywhere that takes a card number.</p>' +
      '<p>The idea is not one card. It is <strong>a card for each thing you pay for</strong>, each with its own spending limit.</p>' +
      '<table class="gtable"><thead><tr><th>Kind of card</th><th>When to use it</th></tr></thead><tbody>' +
      '<tr><td>Open, no end date</td><td>Your everyday card. Use it anywhere, for as long as you want.</td></tr>' +
      '<tr><td>Stops after a number of days</td><td>A free trial you do not want turning into a subscription. Set it for 30 days and it dies on its own.</td></tr>' +
      '<tr><td>Use it once, then stop</td><td>A shop you are buying from one time. The card stops working the moment the payment goes through, so it is worthless to anyone who steals it afterwards.</td></tr>' +
      '</tbody></table>' +
      '<p><strong>The limit is the point.</strong> If you put 15 KPC on a card, nothing can ever take more than 15 KPC from it, no matter what anyone types. A subscription that quietly doubles its price simply gets declined.</p>' +
      '<p><strong>Right now</strong>, you can set your cards up — name them, set limits, choose how long they last — but the actual card numbers are not being issued yet. What you set up now is kept, and the numbers appear on the cards you already made.</p>' },

    { h: "Your limits", html:
      '<p>Four limits apply at once: the most you can send in one payment, the most in a day, the most in a month, and the most you may be holding at any time.</p>' +
      '<p>That last one catches people out. You can be well within your daily limit and still be refused, because the payment would push your balance past the ceiling for your tier.</p>' +
      '<p><strong>Basic</strong> is where every account starts, on a verified phone number alone: 120 KPC in one payment, 240 a day, and 500 held. It is deliberately cautious. It exists so somebody can try KobPay within an hour of hearing about it, without a phone number nobody has checked being able to move real money.</p>' +
      '<p><strong>Verified</strong> needs a government photo ID with a name that matches: 600 a payment, 1,200 a day, 4,000 held.</p>' +
      '<p><strong>Full</strong> adds proof of address: 2,000 a payment, 4,000 a day, 20,000 held.</p>' +
      '<p><strong>Business</strong> is for registered businesses taking payments, and needs the registration plus the owner verified to Full.</p>' +
      '<p>Nobody has to apply or wait for a decision. Each tier states which document opens it, and sending that document is the entire process. Above 5,000 KPC you will also be asked where the money came from — that is the rule in every country, not something KobPay invented.</p>' +
      '<p><strong>Card limits are separate</strong> and sit underneath all of this. A card you capped at 15 KPC a month stays capped at 15, whatever your tier would otherwise allow.</p>' },

    { h: "Keeping your money safe", html:
      '<p class="lede">Read this section even if you skip the others.</p>' +
      '<p><strong>Your PIN.</strong> Four digits, asked for before money leaves your account. Do not use your birthday, your year of birth, or 1234.</p>' +
      '<p><strong>Your fingerprint or face.</strong> Go to Limits &amp; verification and tap Add this device. After that, approving a payment is your fingerprint instead of four digits.</p>' +
      '<p>Your phone checks your fingerprint and unlocks a key that lives only on that phone. KobPay never sees your fingerprint — it is never sent anywhere, and there is no copy of it on any computer to be stolen. A password can be guessed and a PIN can be watched over your shoulder. This cannot.</p>' +
      '<p>It also cannot be used on a fake website. A convincing copy of KobPay can ask you for your PIN and you might type it in, but your fingerprint will simply refuse to work on an address that is not really KobPay.</p>' +
      '<p><strong>KobPay will never ask you for your PIN.</strong> Not by phone, not by text, not by WhatsApp, not by someone who says they work for KobPay. Anyone asking is stealing from you.</p>' +
      '<p><strong>Check the address.</strong> The real app is at kobpay.app. If a link came to you in a message, type the address yourself instead of tapping it.</p>' },

    { h: "Agents", html:
      '<p>An agent is a person with a shop or a stall who turns cash into KobPay money and back, the way a mobile money agent does.</p>' +
      '<p><strong>Putting cash in.</strong> Hand the agent your notes and give them your phone number. They send you the same amount in KPC. You get a notification; check it before you walk away.</p>' +
      '<p><strong>Taking cash out.</strong> In the app, create a cash-out code. Show the six digits to the agent. They give you the notes and the code is used up. It expires on its own after fifteen minutes, so a screenshot of an old one is worth nothing.</p>' +
      '<p><strong>Why the code works this way.</strong> An agent can never take money from your account. The only thing that moves your money out is a code you made, deliberately, that minute. If an agent asks for your PIN instead of a code, they are not following the rules.</p>' },

    { h: "Where your money actually is", html:
      '<p class="lede">You should not have to take anyone’s word for this, and you do not have to.</p>' +
      '<p>Every KPC that exists is a dollar KobPay owes somebody. To back that, KobPay holds real money in real bank accounts. The Ledger page shows both numbers side by side, read from the actual records rather than typed in by hand:</p><ul>' +
      '<li><strong>KPC in existence</strong> — everything everybody is holding, which is everything KobPay owes</li>' +
      '<li><strong>Money held to back it</strong> — what is actually in the accounts, converted to dollars</li>' +
      '<li><strong>Cover</strong> — the second divided by the first. Above 100% means everything owed is covered.</li></ul>' +
      '<p>You can look at this without an account. So can a journalist, a regulator, or someone deciding whether to trust the app.</p>' +
      '<p><strong>What it does not claim.</strong> The page says plainly that these figures are KobPay’s own, checked against KobPay’s own bank statements, and have not been examined by an independent accountant. That sentence is there on purpose. Any money app that shows you numbers without telling you who checked them is asking for more trust than it has earned.</p>' },

    { h: "Questions people ask", html:
      '<p><strong>Is this a cryptocurrency?</strong> No. There is nothing to trade and no price to watch. One KPC is one dollar, today and next year.</p>' +
      '<p><strong>What happens if I lose my phone?</strong> Your money is in your account, not on the phone. Sign in on another phone with your number and it is all there. Remove the old device from the Limits page.</p>' +
      '<p><strong>Can someone take money from my account?</strong> Not without your PIN or your fingerprint. Not an agent, not a shop, not someone who knows your phone number. Knowing your number only lets people send you money.</p>' +
      '<p><strong>I sent money to the wrong person.</strong> Contact them and ask. KobPay cannot reverse a payment that has arrived, for the same reason a bank cannot. This is why the app shows you the name before you confirm.</p>' +
      '<p><strong>What is Safe Send?</strong> The money is held in the middle instead of going straight across. The seller can see it is there but cannot spend it until you confirm you got what you paid for. Worth using for anything bought from a stranger.</p>' +
      '<p><strong>What does it cost?</strong> Sending to another KobPay user is free. Putting money in and taking it out has a fee, shown as an exact amount before you confirm. Holding money costs nothing.</p>' }
  ];

  /* ----------------------------------------------------------------- speech */

  var canSpeak = typeof window !== "undefined" && "speechSynthesis" in window &&
                 typeof window.SpeechSynthesisUtterance === "function";

  function stopSpeech() {
    if (!canSpeak) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    S.speaking = false;
    paintListen();
  }

  function speak(text) {
    if (!canSpeak || !text) return;
    try {
      window.speechSynthesis.cancel();
      // Long passages are split: several engines silently truncate or stall
      // on a single very long utterance.
      var parts = text.match(/[^.!?]+[.!?]*/g) || [text];
      var chunk = "", queue = [];
      parts.forEach(function (p) {
        if ((chunk + p).length > 220) { queue.push(chunk.trim()); chunk = ""; }
        chunk += p;
      });
      if (chunk.trim()) queue.push(chunk.trim());

      queue.forEach(function (q, i) {
        var u = new window.SpeechSynthesisUtterance(q);
        u.rate = 0.97;
        u.pitch = 1;
        if (i === queue.length - 1) {
          u.onend = function () { S.speaking = false; paintListen(); };
        }
        window.speechSynthesis.speak(u);
      });
      S.speaking = true;
      paintListen();
    } catch (e) {
      S.speaking = false;
      paintListen();
    }
  }

  function paintListen() {
    var b = document.getElementById("listen");
    if (!b) return;
    b.setAttribute("aria-pressed", S.speaking ? "true" : "false");
    document.getElementById("listenLabel").textContent = S.speaking ? "Stop" : "Listen";
  }

  // What the narrator reads: whatever is on screen in the current mode, taken
  // from the DOM so it can never drift from what the reader is looking at.
  function narrationText() {
    if (S.mode === "guide") {
      var sect = document.querySelectorAll(".sect")[S.guideSection];
      return sect ? sect.textContent : "";
    }
    var cap = document.getElementById("caption");
    return cap ? cap.textContent.replace(/[A-Z][A-Z\s,']{6,}$/, "") : "";
  }

  /* ----------------------------------------------------------------- render */

  function renderDemo() {
    var v = V[S.ch]();
    document.getElementById("screen").innerHTML = v.html;
    document.getElementById("caption").innerHTML =
      "<h2>" + v.title + "</h2>" + v.body + (v.hint ? '<div class="try">' + esc(v.hint) + "</div>" : "");
    document.getElementById("chapters").innerHTML = CH.map(function (c) {
      return '<button data-ch="' + c.id + '" aria-current="' + (c.id === S.ch) + '">' + c.label + "</button>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#nav button"), function (b) {
      b.setAttribute("aria-current", b.dataset.ch === S.ch ? "true" : "false");
    });

    var amt = document.getElementById("amt");
    if (amt) {
      amt.addEventListener("input", function () {
        S.amount = amt.value.replace(/[^0-9.]/g, "");
        var n = Number(S.amount), go = document.getElementById("go");
        if (go) go.disabled = !(n > 0 && n <= S.balance);
      });
    }
    var mamt = document.getElementById("mamt");
    if (mamt) {
      mamt.addEventListener("input", function () {
        var cedis = Number(mamt.value.replace(/[^0-9.]/g, "")) || 0;
        S.momoAmt = Math.round((cedis / 12.4) * 100) / 100;
        var out = document.querySelector(".rowline .v.big");
        if (out) out.textContent = money(S.momoAmt) + " KPC";
        var g = document.getElementById("mgo");
        if (g) g.disabled = !(S.momoAmt > 0);
      });
    }
    var fp = document.getElementById("fp");
    if (fp) {
      var approve = function () {
        if (fp.classList.contains("scanning")) return;
        fp.classList.add("scanning");
        setTimeout(function () {
          fp.classList.remove("scanning"); fp.classList.add("ok");
          setTimeout(function () {
            S.balance = Math.round((S.balance - Number(S.amount)) * 100) / 100;
            S.step = 3; render();
          }, 300);
        }, 900);
      };
      fp.addEventListener("click", approve);
      fp.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); approve(); }
      });
    }
  }

  function renderGuide() {
    document.getElementById("guideMode").innerHTML = GUIDE.map(function (g, i) {
      return '<section class="sect' + (i === S.guideSection ? " on" : "") + '" data-i="' + i + '">' +
        "<h2>" + g.h + "</h2>" + g.html + "</section>";
    }).join("");
  }

  function render() {
    var demo = S.mode === "demo";
    document.getElementById("demoMode").hidden = !demo;
    document.getElementById("guideMode").hidden = demo;
    Array.prototype.forEach.call(document.querySelectorAll("#mode button"), function (b) {
      b.setAttribute("aria-current", b.dataset.mode === S.mode ? "true" : "false");
    });
    if (demo) renderDemo(); else renderGuide();
    paintListen();
  }

  /* ------------------------------------------------------------------ input */

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-mode],[data-ch],[data-act],#listen,.sect");
    if (!t) return;

    if (t.id === "listen") {
      if (S.speaking) stopSpeech(); else speak(narrationText());
      return;
    }
    if (t.dataset.mode) { stopSpeech(); S.mode = t.dataset.mode; render(); return; }
    if (t.dataset.ch)   { stopSpeech(); S.ch = t.dataset.ch; S.step = 0; render(); return; }

    if (t.classList && t.classList.contains("sect")) {
      var i = Number(t.dataset.i);
      if (S.guideSection !== i) {
        S.guideSection = i;
        Array.prototype.forEach.call(document.querySelectorAll(".sect"), function (s, j) {
          s.classList.toggle("on", j === i);
        });
        if (S.speaking) speak(narrationText());
      }
      return;
    }

    switch (t.dataset.act) {
      case "step": S.step = Number(t.dataset.i); break;
      case "s1": S.step = 1; if (S.ch === "online") cards[0].spent = 12.99; break;
      case "s2": S.step = 2; break;
      case "back": S.step = Math.max(0, S.step - 1); break;
      case "again": S.step = 0; S.amount = ""; S.momoAmt = ""; cards[0].spent = 0; break;
      case "pm": S.payMode = t.dataset.m; break;
      case "mm": S.momoMode = t.dataset.m; S.step = 0; S.momoAmt = ""; break;
      case "mgo":
        S.balance = Math.round((S.balance + (S.momoMode === "in" ? 1 : -1) * Number(S.momoAmt)) * 100) / 100;
        S.step = 1; break;
      case "freeze": S.frozen = !S.frozen; break;
      case "card": S.openCard = Number(t.dataset.i); break;
      case "addsave": S.saved = Math.min(500, S.saved + 20); break;
      default: return;
    }
    render();
  });

  window.addEventListener("pagehide", stopSpeech);

  if (canSpeak) document.getElementById("listen").hidden = false;
  render();
})();
</script>

</body>
</html>
